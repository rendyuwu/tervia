# Workspace root. The companion console-subsystem launcher `tervia.exe`
# lives in a separate workspace member (`tervia-cli/`) so Tauri 2's deb /
# dmg bundlers only see the GUI binary when they enumerate `[[bin]]`
# entries from THIS manifest. Trying to gate the stub via `[[bin]]
# required-features` here did NOT work - the bundlers ignored the gate
# and still expected `target/release/tervia` to exist, then failed because
# cargo had legitimately skipped the build. Splitting the package
# removes the entry from the bundler's view entirely.
#
# `default-members = ["."]` keeps `cargo build` in this directory
# scoped to the GUI package; the release workflow builds the stub
# explicitly via `cargo build --release -p tervia-cli` on Windows only.
[workspace]
members = ["tervia-cli"]
default-members = ["."]

[package]
name = "tervia"
version = "0.1.0"
description = "Tervia - a lightweight desktop client for remote machines: SSH, port forwarding, SFTP and RDP."
authors = ["rendyuwu"]
license = "Apache-2.0"
repository = "https://github.com/rendyuwu/tervia"
homepage = "https://github.com/rendyuwu/tervia"
readme = "../README.md"
edition = "2021"
# Tauri-action invokes `cargo build` without `--bin` and asks Cargo which
# binary to bundle. With the implicit bin (from package.name = "tervia" +
# src/main.rs) plus the explicit `[[bin]] TerviaApp` pointing to the same
# source, Cargo can refuse with "failed to find main binary". Pinning
# default-run resolves it deterministically.
default-run = "TerviaApp"
# Disable auto-discovery so the implicit `tervia` bin (from package.name +
# src/main.rs) does not collide with the explicit `[[bin]] TerviaApp` that
# also points to src/main.rs. The companion launcher lives in a separate
# workspace member, never in `src/bin/` of this package.
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tervia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Main GUI binary. `windows_subsystem = "windows"` (set in main.rs) detaches
# stdio on Windows so the binary cannot synchronously print to the parent
# shell - see the `tervia` console stub below. Renamed from the default
# package-name `tervia.exe` so PATHEXT on Windows finds the console stub first
# (the two cannot share a name on a case-insensitive filesystem).
[[bin]]
name = "TerviaApp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Global allocator. The default Windows system heap retains freed commit on
# bursty, fragmented workloads, so a heavy-output PTY burst (base64 chunks
# streamed host->webview) inflates the process commit to multiple GB and it
# never recedes. mimalloc decommits freed segments back to the OS on its purge
# timer, turning that high-watermark back into transient peaks. See the
# `#[global_allocator]` in lib.rs.
mimalloc = "0.1"
# Already in the tree as mimalloc's own dependency; taken directly for
# `mi_collect`, which is what actually hands freed commit back to the OS. See
# `purge_allocator` in lib.rs.
libmimalloc-sys = { version = "0.1", features = ["extended"] }
tauri = { version = "2" }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Clipboard READS run in the host process instead of through
# `navigator.clipboard.readText()`, which cannot work on Linux - see
# `modules/clipboard.rs` for why. Writes still use the webview API. Default
# features are off deliberately: `image-data` exists for reading/writing IMAGES
# and drags in an image + TIFF/LZW + MIME-sniffing stack (~12 crates) that a
# text-only paste never touches. `wayland-data-control` is not a default but is
# required or a Wayland session (COSMIC, GNOME) has no clipboard at all; arboard
# still prefers X11 when that is what is running. Picked over
# tauri-plugin-clipboard-manager, which is the same arboard call behind an ACL
# plus that whole image stack for five commands we do not use.
arboard = { version = "3", default-features = false, features = [
	"wayland-data-control",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "5"
base64 = "0.22"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
globset = "0.4"
# Direct `regex` for `fs_grep_replace`: file-level `replace_all` instead of
# the line-by-line `grep_regex` matcher used for read-only search.
regex = "1"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
url = "2"
# Default features pull in aws-lc-rs which needs NASM at build time on
# Windows. Use ring instead - pure-Rust + assembly, no toolchain hassle.
#
# Pinned exactly, and the pin is load-bearing - see the IronRDP block below for
# the full story. Short version: russh 0.60.1 states its RustCrypto
# requirements as prerelease-floored carets (`ecdsa ^0.17.0-rc.16`), which is
# the only shape that can co-resolve with the exact `=` pins picky carries.
# 0.60.3 turned every one of those carets into an `=` pin and 0.61+ moved to
# plain `^0.17`; both conflict with picky, so neither can share a tree with the
# RDP dependency set.
russh = { version = "=0.60.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
# PBKDF2 + AES-256-GCM + CSPRNG for the passphrase-encrypted SSH connection
# backup (`modules/backup.rs`). Already in the tree as russh's crypto backend
# (`features = ["ring"]`), so this only promotes a transitive dependency to a
# direct one - no new code is compiled and no new supply-chain surface is
# added. Taken over the RustCrypto stack (aes-gcm + pbkdf2 + hmac, also
# transitively present) because one audited crate covers the KDF, the AEAD and
# the random source, so there is a single place to get the nonce handling
# right. The webview cannot do this itself: `crypto.subtle` is secure-context
# only and the app origin is plain http.
ring = "0.17"
# Stable session ids for the sidecar PTY daemon. v4 (random) is plenty - we
# only need uniqueness across the daemon's lifetime, not global ordering.
uuid = { version = "1", features = ["v4", "serde"] }
# Cross-platform local IPC for the sidecar PTY daemon. Wraps Unix domain
# sockets and Windows named pipes behind one API so the daemon protocol does
# not need parallel transport implementations.
interprocess = { version = "2.2", features = ["tokio"] }
# RDP. The API-boundary crates rather than the `ironrdp-client` convenience
# crate: `RdpClient::run()` owns the whole connect sequence, which leaves
# nowhere to hook certificate TOFU, and it emits whole frames instead of dirty
# rectangles.
#
# Every version here is an exact pin, and NOT because newer is untested. The
# latest set (connector 0.10 / session 0.11 / graphics 0.9 / input 0.7 /
# tokio 0.10) cannot coexist with russh at all:
#
#   ironrdp-connector 0.10.0 requires `picky =7.0.0-rc.25`
#   picky 7.0.0-rc.25    requires `ecdsa =0.17.0-rc.22`, `pkcs8` via a chain
#                                 that resolves pkcs5 to 0.8.0 final
#   russh 0.60.x         calls `pkcs5::pbes2::Parameters::pbkdf2_sha256_aes256cbc`,
#                                 renamed to `generate_*` in pkcs5 0.8.0 -> does
#                                 not compile
#   russh 0.61/0.62      use the new pkcs5 name but require `ecdsa ^0.17`, which
#                                 excludes prereleases -> hard resolver conflict
#                                 with picky's `=0.17.0-rc.22`
#
# connector 0.9.0 pins `picky =7.0.0-rc.23` instead, whose RustCrypto pins
# (`ecdsa =0.17.0-rc.17`, `pkcs8 =0.11.0-rc.11`) sit inside russh 0.60.1's
# caret floors and leave pkcs5 at 0.8.0-rc.13, so russh still compiles. That is
# the whole reason for staying one minor behind. session 0.10.0 / graphics
# 0.8.1 / input 0.6.0 / tokio 0.9.0 are simply the versions that pair with
# connector 0.9 on ironrdp-pdu 0.8 + ironrdp-core 0.2.
#
# The escape route is upstream, not local: picky 7.0.0-rc.26 already relaxes
# those pins to `ed25519-dalek ^3` / `p256 ^0.14`. When an ironrdp-connector
# release pins rc.26 or later, this whole block and the russh pin can move
# forward together.
ironrdp-connector = "=0.9.0"
ironrdp-session = "=0.10.0"
ironrdp-tokio = "=0.9.0"
# `rustls-ring` and not `rustls`: the latter aliases `rustls-aws-lc-rs`, which
# needs NASM at build time on Windows. Same reason russh is pinned to ring.
ironrdp-tls = { version = "0.2", default-features = false, features = [
	"rustls-ring",
] }
ironrdp-graphics = "=0.8.1"
ironrdp-input = "=0.6.0"
# Already in the tree as transitive dependencies of the four crates above, at
# exactly these versions - promoted to direct entries because nothing
# re-exports them and the RDP module names their types. `ironrdp-pdu` for
# `Action` (the discriminant `Framed::read_pdu` hands back), `InclusiveRectangle`
# and the `Rectangle` trait that gives it `width()`/`height()`; `ironrdp-core`
# for `WriteBuf`, which appears in every `Sequence::step` signature. The `=`
# pins are the versions connector 0.9 / session 0.10 resolve to; a different
# version would make the rectangle types distinct and stop compiling.
ironrdp-pdu = "=0.8.0"
ironrdp-core = { version = "=0.2.1", features = ["alloc"] }
# TCP keepalive with a usable idle time on the RDP socket. Already in the tree
# via tokio/hyper at exactly this version, so this is a promotion, not a new
# crate. Needed because tokio only exposes `TcpSocket::set_keepalive(bool)`,
# which turns SO_KEEPALIVE on at the OS default idle - two hours on Linux - and
# an RDP session that has silently lost its network needs to notice in seconds,
# not after lunch. `TCP_KEEPIDLE`/`TCP_KEEPINTVL` need socket2. See
# `KEEPALIVE_IDLE` in `modules/rdp/session.rs`; the SSH module solves the same
# problem with russh's own `keepalive_interval`.
socket2 = "0.6"
# Leaf-certificate parsing for the RDP certificate TOFU check: the SHA-256
# fingerprint's subject/issuer labels, and the `x509_cert::Certificate` that
# `ironrdp_tls::extract_tls_server_public_key` takes (CredSSP binds to the
# server's SubjectPublicKey, not to the whole certificate). Already in the tree
# with the same feature set as `ironrdp-tls`'s own dependency, so this adds no
# new compilation.
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
# Direct entries so the custom `ServerCertVerifier` doing certificate TOFU can
# be injected into the `TlsConnector`. `ironrdp-tls` hardcodes
# `NoCertificateVerification` with no callback seam, so owning the connector is
# the only way to validate the server certificate during the handshake rather
# than after it. Default features off on both: rustls defaults to the
# aws-lc-rs provider.
tokio-rustls = { version = "0.26", default-features = false, features = [
	"ring",
	"logging",
	"tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
	"ring",
	"logging",
	"std",
	"tls12",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
windows-sys = { version = "0.59", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Cryptography",
	"Win32_Storage_FileSystem",
	"Win32_System_Console",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
	"Win32_Graphics_Dwm",
	"Win32_Graphics_Gdi",
	"Win32_UI_WindowsAndMessaging",
] }
# WebView2 settings interop: `disable_browser_accelerator_keys` reaches for
# `ICoreWebView2Settings3` so the app shell owns Ctrl+W / Ctrl+N / Ctrl+R rather
# than the embedded browser. Versions match the copies wry already pulls in, so
# no duplicate crates are added.
webview2-com = "0.38"
windows = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_System_Memory",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"
